name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  build-staging-images:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
          - worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lead-flood-${{ matrix.service }}:staging-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/${{ github.repository_owner }}/lead-flood-${{ matrix.service }}:staging-latest

  migrate-staging-db:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      }}
    runs-on: ubuntu-latest
    needs: build-staging-images
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link Supabase project
        run: pnpm db:link

      - name: Run database migrations
        run: pnpm db:migrate:prod

  deploy-staging:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      }}
    runs-on: ubuntu-latest
    needs: [build-staging-images, migrate-staging-db]
    environment: staging
    env:
      STAGING_DEPLOY_WEBHOOK: ${{ secrets.STAGING_DEPLOY_WEBHOOK }}
      STAGING_API_READY_URL: ${{ secrets.STAGING_API_READY_URL }}
      STAGING_SMOKE_URL: ${{ secrets.STAGING_SMOKE_URL }}
    steps:
      - name: Trigger staging deployment webhook
        if: ${{ env.STAGING_DEPLOY_WEBHOOK != '' }}
        run: curl -fsS -X POST "$STAGING_DEPLOY_WEBHOOK"

      - name: Skip deployment trigger when webhook is missing
        if: ${{ env.STAGING_DEPLOY_WEBHOOK == '' }}
        run: echo "STAGING_DEPLOY_WEBHOOK is not set; images were published only."

      - name: Run staging API readiness check
        if: ${{ env.STAGING_API_READY_URL != '' }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$STAGING_API_READY_URL" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Staging API /ready check timed out: $STAGING_API_READY_URL"
          exit 1

      - name: Run staging supplemental smoke check
        if: ${{ env.STAGING_SMOKE_URL != '' }}
        run: curl -fsS "$STAGING_SMOKE_URL"

  build-production-images:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    needs: verify-production-main-ref
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
          - worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lead-flood-${{ matrix.service }}:production-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lead-flood-${{ matrix.service }}:production-latest

  migrate-production-db:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    needs: build-production-images
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link Supabase project
        run: pnpm db:link

      - name: Run database migrations
        run: pnpm db:migrate:prod

  deploy-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    needs: [build-production-images, migrate-production-db]
    environment: production
    env:
      RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
      PRODUCTION_API_READY_URL: ${{ secrets.PRODUCTION_API_READY_URL }}
      PRODUCTION_SMOKE_URL: ${{ secrets.PRODUCTION_SMOKE_URL }}
      SMOKE_WEB_BASE_URL: ${{ secrets.PRODUCTION_SMOKE_WEB_BASE_URL }}
      SMOKE_API_BASE_URL: ${{ secrets.PRODUCTION_SMOKE_API_BASE_URL }}
      SMOKE_CORS_ORIGIN: ${{ secrets.PRODUCTION_SMOKE_CORS_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Trigger lead-flood-api deployment
        run: |
          response="$(
            curl --fail --silent --show-error \
              --request POST \
              --url https://backboard.railway.com/graphql/v2 \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer ${RAILWAY_PROJECT_TOKEN}" \
              --data '{"query":"mutation environmentTriggersDeploy($input: EnvironmentTriggersDeployInput!) { environmentTriggersDeploy(input: $input) }","variables":{"input":{"projectId":"30c6dd11-3c75-4f69-835d-60b53a0d99d5","environmentId":"2d87fd16-66c4-43b9-98dc-d738548704b0","serviceId":"5c509bb0-634b-45a8-a18d-8fbe2ba24a7f"}}}'
          )"
          RESPONSE="$response" python - <<'PY'
          import json
          import os
          import sys

          response = json.loads(os.environ["RESPONSE"])
          if response.get("errors"):
              print(json.dumps(response["errors"]), file=sys.stderr)
              sys.exit(1)
          if response.get("data", {}).get("environmentTriggersDeploy") is not True:
              print(json.dumps(response), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Trigger lead-flood-worker deployment
        run: |
          response="$(
            curl --fail --silent --show-error \
              --request POST \
              --url https://backboard.railway.com/graphql/v2 \
              --header "Content-Type: application/json" \
              --header "Authorization: Bearer ${RAILWAY_PROJECT_TOKEN}" \
              --data '{"query":"mutation environmentTriggersDeploy($input: EnvironmentTriggersDeployInput!) { environmentTriggersDeploy(input: $input) }","variables":{"input":{"projectId":"30c6dd11-3c75-4f69-835d-60b53a0d99d5","environmentId":"2d87fd16-66c4-43b9-98dc-d738548704b0","serviceId":"112c1d20-c841-42b8-9e88-ce56c05398e1"}}}'
          )"
          RESPONSE="$response" python - <<'PY'
          import json
          import os
          import sys

          response = json.loads(os.environ["RESPONSE"])
          if response.get("errors"):
              print(json.dumps(response["errors"]), file=sys.stderr)
              sys.exit(1)
          if response.get("data", {}).get("environmentTriggersDeploy") is not True:
              print(json.dumps(response), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Run production API readiness check
        run: |
          ready_urls=()
          if [[ -n "$PRODUCTION_API_READY_URL" ]]; then
            ready_urls+=("$PRODUCTION_API_READY_URL")
          fi
          if [[ -n "$SMOKE_API_BASE_URL" ]]; then
            ready_urls+=("${SMOKE_API_BASE_URL%/}/ready")
          fi
          if [[ "${#ready_urls[@]}" -eq 0 ]]; then
            echo "No production API readiness URL configured."
            exit 1
          fi
          for _ in $(seq 1 30); do
            for ready_url in "${ready_urls[@]}"; do
              if curl -fsS "$ready_url" > /dev/null; then
                exit 0
              fi
            done
            sleep 10
          done
          echo "Production API /ready check timed out."
          exit 1

      - name: Run required repo-owned production smoke check
        run: bash scripts/release/smoke-production.sh

      - name: Run production supplemental smoke check
        if: ${{ env.PRODUCTION_SMOKE_URL != '' }}
        run: curl -fsS "$PRODUCTION_SMOKE_URL"

  verify-production-main-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless the production dispatch ref is main
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production deploys must be dispatched from refs/heads/main, received ${GITHUB_REF}." >&2
            exit 1
          fi
