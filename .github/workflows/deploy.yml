name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  build-staging-images:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
          - worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lead-flood-${{ matrix.service }}:staging-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/${{ github.repository_owner }}/lead-flood-${{ matrix.service }}:staging-latest

  migrate-staging-db:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      }}
    runs-on: ubuntu-latest
    needs: build-staging-images
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate:prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  deploy-staging:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      }}
    runs-on: ubuntu-latest
    needs: [build-staging-images, migrate-staging-db]
    environment: staging
    env:
      STAGING_DEPLOY_WEBHOOK: ${{ secrets.STAGING_DEPLOY_WEBHOOK }}
      STAGING_API_READY_URL: ${{ secrets.STAGING_API_READY_URL }}
      STAGING_SMOKE_URL: ${{ secrets.STAGING_SMOKE_URL }}
    steps:
      - name: Trigger staging deployment webhook
        if: ${{ env.STAGING_DEPLOY_WEBHOOK != '' }}
        run: curl -fsS -X POST "$STAGING_DEPLOY_WEBHOOK"

      - name: Skip deployment trigger when webhook is missing
        if: ${{ env.STAGING_DEPLOY_WEBHOOK == '' }}
        run: echo "STAGING_DEPLOY_WEBHOOK is not set; images were published only."

      - name: Run staging API readiness check
        if: ${{ env.STAGING_API_READY_URL != '' }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$STAGING_API_READY_URL" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Staging API /ready check timed out: $STAGING_API_READY_URL"
          exit 1

      - name: Run staging supplemental smoke check
        if: ${{ env.STAGING_SMOKE_URL != '' }}
        run: curl -fsS "$STAGING_SMOKE_URL"

  build-production-images:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
          - worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lead-flood-${{ matrix.service }}:production-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lead-flood-${{ matrix.service }}:production-latest

  migrate-production-db:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    needs: build-production-images
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate:prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  deploy-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    needs: [build-production-images, migrate-production-db]
    environment: production
    env:
      PRODUCTION_DEPLOY_WEBHOOK: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}
      PRODUCTION_API_READY_URL: ${{ secrets.PRODUCTION_API_READY_URL }}
      PRODUCTION_SMOKE_URL: ${{ secrets.PRODUCTION_SMOKE_URL }}
    steps:
      - name: Trigger production deployment webhook
        if: ${{ env.PRODUCTION_DEPLOY_WEBHOOK != '' }}
        run: curl -fsS -X POST "$PRODUCTION_DEPLOY_WEBHOOK"

      - name: Skip deployment trigger when webhook is missing
        if: ${{ env.PRODUCTION_DEPLOY_WEBHOOK == '' }}
        run: echo "PRODUCTION_DEPLOY_WEBHOOK is not set; images were published only."

      - name: Run production API readiness check
        if: ${{ env.PRODUCTION_API_READY_URL != '' }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$PRODUCTION_API_READY_URL" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Production API /ready check timed out: $PRODUCTION_API_READY_URL"
          exit 1

      - name: Run production supplemental smoke check
        if: ${{ env.PRODUCTION_SMOKE_URL != '' }}
        run: curl -fsS "$PRODUCTION_SMOKE_URL"
