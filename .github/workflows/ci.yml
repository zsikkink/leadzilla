name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_flood
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lead_flood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5434/lead_flood
      DIRECT_URL: postgresql://postgres:postgres@localhost:5434/lead_flood
      APP_ENV: ci
      NODE_ENV: test
      API_PORT: 5050
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      PG_BOSS_SCHEMA: pgboss
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
      SUPABASE_PROJECT_REF: cbcgrzvqidtrtrtnzlso

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap canonical SQL database
        env:
          OUTPUT_ENV_FILE: ${{ runner.temp }}/ci-sql-bootstrap.env
          SQL_BOOTSTRAP_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/postgres
          SQL_BOOTSTRAP_DATABASE_NAME: lead_flood_ci
          SQL_BOOTSTRAP_DROP_EXISTING: '1'
        run: |
          bash scripts/db/bootstrap-sql-disposable.sh
          source "$OUTPUT_ENV_FILE"
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DIRECT_URL=$DIRECT_URL"
          } >> "$GITHUB_ENV"

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  sql-bootstrap-api-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_flood
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lead_flood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SQL_BOOTSTRAP_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/postgres
      SQL_BOOTSTRAP_DATABASE_NAME: lead_flood_sql_shadow
      SQL_BOOTSTRAP_DROP_EXISTING: '1'
      SUPABASE_PROJECT_REF: cbcgrzvqidtrtrtnzlso

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SQL-first API /ready validation
        run: pnpm db:validate:sql-bootstrap:api

      - name: Run SQL-first discovery phase 1 tests
        env:
          SQL_BOOTSTRAP_DATABASE_NAME: lead_flood_sql_phase1
          SQL_BOOTSTRAP_DROP_EXISTING: '1'
        run: pnpm --filter @lead-flood/db test:sql:discovery-phase1

  sql-bootstrap-worker-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_flood
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lead_flood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SQL_BOOTSTRAP_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/postgres
      SQL_BOOTSTRAP_DATABASE_NAME: lead_flood_sql_shadow_worker
      SQL_BOOTSTRAP_DROP_EXISTING: '1'
      SUPABASE_PROJECT_REF: cbcgrzvqidtrtrtnzlso

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SQL-first worker startup/schema-guard validation
        run: pnpm db:validate:sql-bootstrap:worker

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-and-test, sql-bootstrap-api-ready, sql-bootstrap-worker-startup]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lead_flood
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lead_flood"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SQL_BOOTSTRAP_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/postgres
      SQL_BOOTSTRAP_DATABASE_NAME: lead_flood_release_runtime
      SQL_BOOTSTRAP_DROP_EXISTING: '1'
      APP_ENV: ci
      NODE_ENV: production
      API_PORT: 5050
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      PG_BOSS_SCHEMA: pgboss
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
      SUPABASE_PROJECT_REF: cbcgrzvqidtrtrtnzlso

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Bootstrap canonical SQL DB for built-runtime validation
        env:
          OUTPUT_ENV_FILE: ${{ runner.temp }}/runtime-sql-bootstrap.env
        run: |
          bash scripts/db/bootstrap-sql-disposable.sh
          source "$OUTPUT_ENV_FILE"
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "DIRECT_URL=$DIRECT_URL"
          } >> "$GITHUB_ENV"

      - name: Validate built API /ready
        run: pnpm db:validate:runtime-services:api

      - name: Validate built worker startup/schema guard
        run: pnpm db:validate:runtime-services:worker
